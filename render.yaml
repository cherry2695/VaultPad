# VaultPad — Render Deployment Configuration
# https://render.com/docs/render-yaml

services:
  - type: web
    name: vaultpad
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GOOGLE_CLIENT_ID
        value: 234820566115-jfs0kiae3pf0pqbalcpnqt8hklmm1ml4.apps.googleusercontent.com
      - key: GOOGLE_CALLBACK_URL
        value: https://vaultpad-secure-code-file-storage-platform.onrender.com/auth/google/callback
      # ── Set these in Render Dashboard → Environment (never commit secrets) ──
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
