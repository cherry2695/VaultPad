# VaultPad — Render Deployment Configuration
# https://render.com/docs/render-yaml

services:
  - type: web
    name: vaultpad
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ── Set these in the Render dashboard (Dashboard → Service → Environment) ──
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      # ── Change this to your actual Render URL after first deploy ──────────────
      - key: GOOGLE_CALLBACK_URL
        value: https://vaultpad.onrender.com/auth/google/callback
